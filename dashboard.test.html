<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>FlowStudy 面板測試</title>
<link rel="stylesheet" href="review.css" />
<link rel="stylesheet" href="review-pages.css" />
<style>
  #report{position:fixed;right:12px;bottom:12px;max-width:440px;max-height:52vh;overflow:auto;z-index:99;
          background:#0f172a;color:#e2e8f0;font:12px/1.6 ui-monospace,monospace;padding:12px 14px;
          border-radius:10px;white-space:pre-wrap;box-shadow:0 8px 30px rgba(0,0,0,.35)}
</style>
</head>
<body>
<pre id="report">執行中…</pre>

<script type="module">
// 這個測試一開始就會刪掉整個 flowstudy 資料庫。如果在擴充功能自己的網址下開啟
// （chrome-extension://…/xxx.test.html），刪到的就是真正的學習資料——所以直接拒絕執行。
// 測試請用本機伺服器開（http://127.0.0.1:…），那是另一個 origin，資料庫互不相干。
if (location.protocol === "chrome-extension:") {
  document.body.innerHTML =
    '<h1 style="font:600 20px sans-serif;color:#b91c1c">已停止：這個測試會清空學習資料庫</h1>' +
    '<p style="font:14px sans-serif">請用本機伺服器開啟測試頁，不要在擴充功能的網址下執行。</p>';
  throw new Error("拒絕在擴充功能的 origin 執行會清空資料庫的測試");
}

const lines = [];
let pass = 0, fail = 0;
const check = (n, c, d) => {
  if (c) { pass++; lines.push("✓ " + n); }
  else { fail++; lines.push("✗ " + n + (d !== undefined ? "\n    → " + d : "")); }
};
const section = (t) => lines.push("\n" + t);
const paint = () => {
  lines.push("\n" + "─".repeat(36));
  lines.push(`通過 ${pass}　失敗 ${fail}`);
  document.getElementById("report").textContent = lines.join("\n");
  document.title = fail === 0 ? "ALL PASS" : ("FAIL " + fail);
};

// ---- 擴充功能 API 的記憶體替身 ----
const mem = {};
globalThis.chrome = {
  storage: {
    local: {
      get(keys, cb) {
        let o = {};
        if (keys == null) o = { ...mem };
        else if (typeof keys === "string") { if (mem[keys] !== undefined) o[keys] = mem[keys]; }
        else if (Array.isArray(keys)) keys.forEach(k => { if (mem[k] !== undefined) o[k] = mem[k]; });
        if (cb) cb(o); return Promise.resolve(o);
      },
      set(o, cb) { Object.assign(mem, o); if (cb) cb(); return Promise.resolve(); },
      remove(k, cb) { (Array.isArray(k)?k:[k]).forEach(x => delete mem[x]); if (cb) cb(); return Promise.resolve(); },
    },
    onChanged: { addListener(){}, removeListener(){} },
  },
  runtime: { lastError: null, sendMessage(m, cb) { if (cb) cb({ ok: true }); } },
};

const settle = (ms = 400) => new Promise(r => setTimeout(r, ms));
const $  = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const txt = () => $(".content-inner").textContent.replace(/\s+/g, " ");

(async () => {
  await new Promise(r => { const q = indexedDB.deleteDatabase("flowstudy"); q.onsuccess=q.onerror=q.onblocked=()=>r(); });

  const V = await import("./core/storage/vocabularyStore.js");
  const S = await import("./core/storage/settingsStore.js");
  const { STORES, put } = await import("./core/storage/db.js");
  const { createImmersionSession } = await import("./core/models.js");

  await S.saveSettings({ dailyGoalMinutes: 25, theme: "light" });

  // 兩部影片，各收藏幾個單字（全部都是「今天」收藏的）
  const seed = [
    ["VIDA", "影片 A：晨間routine", [["advantage","優勢","that gives you an unfair advantage",42.5],
                                     ["fluent","流利的","She is fluent in three languages.",88],
                                     ["context","情境","Words make sense in context.",120]]],
    ["VIDB", "影片 B：咖啡店規則", [["serendipity","機緣湊巧","It was pure serendipity that we met.",12],
                                    ["assume","假設","Don't assume you already know it.",65]]],
  ];
  for (const [vid, title, items] of seed) {
    for (const [term, tr, sentence, start] of items) {
      await V.saveWordFromSubtitle({ term, translation: tr, videoId: vid, videoTitle: title,
                                     sentence, startTime: start, endTime: start + 3 });
    }
  }

  // 過去 40 天的沉浸紀錄，讓方格圖與長條圖有資料
  const today = new Date();
  for (let d = 1; d < 40; d++) {
    if (d % 3 === 1) continue;
    const day = new Date(today); day.setDate(day.getDate() - d); day.setHours(14,0,0,0);
    const s = createImmersionSession({ videoId: "VIDA", videoTitle: "影片 A", startedAt: day.toISOString() });
    s.watchedSeconds = 300 + ((d * 137) % 3300); s.endedAt = day.toISOString();
    await put(STORES.IMMERSION_SESSIONS, s);
  }
  // 今天固定 18 分鐘，用來驗證「18/30 = 60% 高度」這個絕對刻度
  const t0 = createImmersionSession({ videoId: "VIDA", videoTitle: "影片 A" });
  t0.watchedSeconds = 18 * 60;
  await put(STORES.IMMERSION_SESSIONS, t0);

  // 前天刻意放一筆 50 分鐘，超過基準 30，用來驗證破表的鋸齒截斷
  const overDay = new Date(today); overDay.setDate(overDay.getDate() - 2); overDay.setHours(20,0,0,0);
  const over = createImmersionSession({ videoId: "VIDA", videoTitle: "影片 A", startedAt: overDay.toISOString() });
  over.watchedSeconds = 50 * 60; over.endedAt = overDay.toISOString();
  await put(STORES.IMMERSION_SESSIONS, over);

  // 把真正的 review.html 外殼載進來，再跑真正的 review.js
  const html = await fetch("review.html").then(r => r.text());
  const doc = new DOMParser().parseFromString(html, "text/html");
  document.body.insertBefore(doc.querySelector(".layout"), $("#report"));
  await import("./review.js");
  await settle(700);

  section("1. 外殼與導覽");
  const navNames = $$(".sidebar-nav .sidebar-link").map(a => a.textContent.trim().split(/\s+/)[0]);
  check("側邊欄 3 個項目：首頁 / 記憶固化 / 設定", navNames.join(",") === "首頁,記憶固化,設定", navNames.join(","));
  check("沒有「詞彙庫」這個名字了", !$(".sidebar").textContent.includes("詞彙庫"));
  check("沒有數據分析頁", !$('[data-view="analytics"]'));
  check("頂欄只有『儀表板』", $(".topbar").textContent.trim() === "儀表板", $(".topbar").textContent.trim());
  check("側邊欄寬 288px", Math.round($(".sidebar").getBoundingClientRect().width) === 288);
  // 這裡刻意檢查「CSS 規則」而不是 getComputedStyle。
  // 側欄連結是 <a href>，瀏覽器對「已造訪連結」的 getComputedStyle 有隱私限制：
  // 實測連 !important 的字面值都讀不出來（但畫面上是正常的）。
  // 讀計算樣式會得到假陰性，所以改驗規則本身。
  check("選取狀態用中性灰 rgb(228,228,231)", (() => {
    const rules = [...document.styleSheets].flatMap(s => { try { return [...s.cssRules]; } catch { return []; } });
    const rule = rules.find(r => r.selectorText === ".sidebar-link.active");
    if (!rule) return false;
    const bg = rule.style.backgroundColor || rule.style.background;
    if (!bg.includes("--nav-active")) return false;
    return getComputedStyle(document.documentElement).getPropertyValue("--nav-active").trim() === "rgb(228, 228, 231)";
  })(), getComputedStyle(document.documentElement).getPropertyValue("--nav-active"));

  {
    const mark = $(".sidebar-logo-mark");
    const ms = getComputedStyle(mark);
    check("標誌是圓角底板托住圖示，不是裸放的圖",
      ms.borderRadius === "11px" && ms.backgroundColor !== "rgba(0, 0, 0, 0)",
      `${ms.borderRadius} / ${ms.backgroundColor}`);
    check("底板是深色，黃色的 C 才有對比（白底上的淡色底板等於沒有）",
      ms.backgroundColor === "rgb(17, 24, 39)", ms.backgroundColor);
    check("深色主題另給一個值，不會跟深色側欄糊在一起", (() => {
      document.documentElement.setAttribute("data-theme", "dark");
      const dark = getComputedStyle(mark).backgroundColor;
      const sidebarBg = getComputedStyle($(".sidebar")).backgroundColor;
      document.documentElement.removeAttribute("data-theme");
      return dark !== "rgb(17, 24, 39)" && dark !== sidebarBg;
    })());
    check("圖示有內縮，1px 外圈不會被蓋掉", ms.padding === "6px", ms.padding);
    check("底板 38px，跟側欄標題對得起來",
      Math.round(mark.getBoundingClientRect().width) === 38, mark.getBoundingClientRect().width);
  }

  section("2. 首頁");
  check("今日沉浸 18 分鐘", $(".goal-figure-value")?.textContent.trim() === "18", $(".goal-figure-value")?.textContent);
  check("大數字 60px", getComputedStyle($(".goal-figure-value")).fontSize === "60px");
  check("有今日剩餘倒數", /\d{2}:\d{2}:\d{2}/.test($("#countdown")?.textContent || ""));
  check("進度條有跑光動畫", getComputedStyle($(".progress-fill")).animationName.includes("flowstudy-shimmer"));
  check("摘要卡是「今日新單字」不是「總詞彙量」", txt().includes("今日新單字") && !txt().includes("總詞彙量"));
  const todayNewEl = () => $$(".summary-value-num").map(e => e.textContent.trim());
  check("今日新單字 = 5", todayNewEl().includes("5"), todayNewEl().join("/"));
  check("顯示累積收藏", txt().includes("累積收藏"));
  check("今日新單字不顯示跟昨天比的漲跌（沒有 ▲▼ 百分比）", !$(".delta-badge") && !/[+-]\d+%/.test($$(".summary-section")[1]?.textContent || ""));

  section("   學習成效長條圖（固定基準 30）");
  check("7 天", $$(".bar-col").length === 7, $$(".bar-col").length);
  check("每天兩根柱子（分鐘 + 新單字）", $$(".bar-col")[0].querySelectorAll(".bar").length === 2);
  check("新單字綠柱回來了", !!$(".bar-words"));
  check("左側 Y 軸刻度已移除", !$(".bar-axis"));
  check("藍柱用專屬的圖表色（不是 --primary）",
    getComputedStyle($(".bar-minutes")).backgroundColor !== getComputedStyle($(".progress-fill")).backgroundColor,
    `bar=${getComputedStyle($(".bar-minutes")).backgroundColor} / progress=${getComputedStyle($(".progress-fill")).backgroundColor}`);
  check("綠柱與藍柱顏色不同",
    getComputedStyle($(".bar-words")).backgroundColor !== getComputedStyle($(".bar-minutes")).backgroundColor);

  section("   數值改用 hover 提示框");
  check("柱子上不再直接標數字", !$(".bar-value"));
  {
    const col = $$(".bar-col")[$$(".bar-col").length - 1];
    col.dispatchEvent(new MouseEvent("mouseover", { bubbles: true }));
    await settle(120);
    const tip = $("#chartTooltip");
    check("滑上去會出現提示框", tip && !tip.hidden);
    const tipText = (tip?.textContent || "").replace(/\s+/g, " ");
    check("提示框有星期", /週[一二三四五六日]/.test(tipText), tipText);
    check("提示框有『總沉浸時間: XX min』", /總沉浸時間: 18 min/.test(tipText), tipText);
    check("提示框有『新單詞: XX』", /新單詞: \d+/.test(tipText), tipText);
    check("提示框是白底", getComputedStyle(tip).backgroundColor === "rgb(255, 255, 255)",
      getComputedStyle(tip).backgroundColor);
    // 強制置頂：切到柱子高度差很多的兩天，提示框的 top 不可以跟著變
    const topA = getComputedStyle(tip).top;
    const tallCol = $$(".bar-col").find(c => parseFloat(c.querySelector(".bar-minutes").style.height) > 90);
    if (tallCol) {
      tallCol.dispatchEvent(new MouseEvent("mouseover", { bubbles: true }));
      await settle(100);
      check("★ 提示框垂直位置固定，不隨柱高浮動", getComputedStyle(tip).top === topA,
        `${topA} → ${getComputedStyle(tip).top}`);
    }
    check("★ 提示框整個在柱子區域之上（不壓到任何柱子）",
      tip.getBoundingClientRect().bottom <= $(".bar-chart").getBoundingClientRect().top,
      `提示框底 ${Math.round(tip.getBoundingClientRect().bottom)} vs 柱區頂 ${Math.round($(".bar-chart").getBoundingClientRect().top)}`);
    check("★ 連攻頂 100% 的柱子也不會被蓋到", (() => {
      const tallest = $$(".bar-minutes").reduce((a, b) =>
        a.getBoundingClientRect().top < b.getBoundingClientRect().top ? a : b);
      return tip.getBoundingClientRect().bottom <= tallest.getBoundingClientRect().top;
    })());
    check("提示框往上溢出到卡片外（這是刻意的）",
      tip.getBoundingClientRect().top < $(".chart-card").getBoundingClientRect().top,
      `提示框頂 ${Math.round(tip.getBoundingClientRect().top)} vs 卡片頂 ${Math.round($(".chart-card").getBoundingClientRect().top)}`);
    check("圖表卡片不裁切溢出內容", getComputedStyle($(".chart-card")).overflow === "visible",
      getComputedStyle($(".chart-card")).overflow);
    $("#barCols").dispatchEvent(new MouseEvent("mouseleave", { bubbles: true }));
    await settle(80);
    check("移開後提示框消失", $("#chartTooltip").hidden);
  }

  // 等比例刻度（下限 30）：種子資料裡前天有 50 分鐘，所以攻頂值 = 50
  // → 今天 18 分鐘應該是 18/50 = 36%，50 分鐘那天才是 100%
  section("   等比例刻度（下限 30）");
  {
    const cols = $$(".bar-col");
    const h = (col) => parseFloat(col.querySelector(".bar-minutes").style.height) || 0;
    const mins = (col) => Number(col.dataset.minutes);

    const todayCol = cols[cols.length - 1];
    const maxCol = cols.reduce((a, b) => (mins(a) >= mins(b) ? a : b));
    const scale = Math.max(30, ...cols.map(mins));

    check("本週最大值 50 分鐘 → 攻頂 100%", Math.abs(h(maxCol) - 100) < 0.5,
      `${mins(maxCol)} 分 → ${h(maxCol)}%`);
    check("★ 今天 18 分鐘 = 18/50 = 36%（依最大值等比例縮放）",
      Math.abs(h(todayCol) - (18 / scale) * 100) < 0.5, `${mins(todayCol)} 分 → ${h(todayCol)}%`);
    check("★ 不是用固定 30 當基準（否則 18 分會是 60%）", Math.abs(h(todayCol) - 60) > 1, h(todayCol) + "%");
    check("每根柱子的高度都與數值成正比", cols.every(c => {
      const expect = mins(c) > 0 ? Math.max(4, (mins(c) / scale) * 100) : 0;
      return Math.abs(h(c) - expect) < 0.5;
    }));
    check("★ 沒有任何柱子被截斷（不再需要破表符號）", !$(".bar.is-over"));
    check("柱子上沒有遮罩切口", (() => {
      const b = $$(".bar").find(x => parseFloat(x.style.height) > 0);
      const cs = b && getComputedStyle(b);
      return !b || cs.maskImage === "none" || !cs.maskImage;
    })(), getComputedStyle($$(".bar").find(x => parseFloat(x.style.height) > 0)).maskImage);
  }

  section("   沉浸習慣方格圖");
  check("最左邊 7 個星期標籤", $$(".heatmap-row-label").length === 7);
  check("上方 5 個日期標籤", $$(".heatmap-col-label").length === 5, $$(".heatmap-col-label").length);
  {
    const cell = $$(".heatmap-cell").find(c => !c.classList.contains("is-empty") && c.dataset.minutes > 0);
    // :hover 沒辦法用 JS 觸發，改成直接檢查 CSS 規則存在且有畫外圈。
    // 值是 var(--ring-color)，所以不能比對 rgb，要比對變數名。
    check("方格有 hover 外圈光暈樣式", (() => {
      const rules = [...document.styleSheets].flatMap(s => { try { return [...s.cssRules]; } catch { return []; } });
      const rule = rules.find(r => r.selectorText && r.selectorText.includes(".heatmap-cell") &&
        r.selectorText.includes(":hover"));
      return !!rule && (rule.style.boxShadow || "").includes("--ring-color");
    })(), (() => {
      const rules = [...document.styleSheets].flatMap(s => { try { return [...s.cssRules]; } catch { return []; } });
      const rule = rules.find(r => r.selectorText && r.selectorText.includes(".heatmap-cell") && r.selectorText.includes(":hover"));
      return rule ? rule.style.boxShadow : "找不到 :hover 規則";
    })());
    check("外圈顏色是深灰（slate-400）",
      getComputedStyle(document.documentElement).getPropertyValue("--ring-color").trim() === "#94a3b8",
      getComputedStyle(document.documentElement).getPropertyValue("--ring-color"));
    cell.dispatchEvent(new MouseEvent("mouseover", { bubbles: true }));
    await settle(120);
    const tip = $("#heatTooltip");
    check("滑上方格會出現提示框", tip && !tip.hidden);
    const tipText = (tip?.textContent || "").replace(/\s+/g, " ").trim();
    check("★ 提示框不再顯示日期", !/\d+月\d+日/.test(tipText), tipText);
    check("★ 格式是「英文星期簡寫, Week N」", /^(Mon|Tue|Wed|Thu|Fri|Sat|Sun), Week \d+/.test(tipText), tipText);
    check("有顯示時數", /(min|hour)/.test(tipText), tipText);

    // 最上排（週一）的方格：提示框必須浮在它正上方，即使溢出卡片也一樣
    {
      const topCell = $$(".heatmap-cell").find(c =>
        !c.classList.contains("is-empty") && c.dataset.dow === "0" && Number(c.dataset.minutes) > 0);
      check("有最上排的方格可測", !!topCell);
      if (topCell) {
        topCell.dispatchEvent(new MouseEvent("mouseover", { bubbles: true }));
        await settle(120);
        const tipRect = tip.getBoundingClientRect();
        const cellRect = topCell.getBoundingClientRect();
        check("★ 最上排的提示框在方格正上方",
          tipRect.bottom <= cellRect.top + 1, `tip.bottom=${Math.round(tipRect.bottom)} cell.top=${Math.round(cellRect.top)}`);
        check("★ 水平置中對齊方格",
          Math.abs((tipRect.left + tipRect.width/2) - (cellRect.left + cellRect.width/2)) < 3,
          `tip中心=${Math.round(tipRect.left+tipRect.width/2)} cell中心=${Math.round(cellRect.left+cellRect.width/2)}`);
      }
    }
    check("★ 提示框不在捲動容器內（否則會被裁掉）",
      !$(".heatmap-scroll").contains($("#heatTooltip")));
    check("方格卡片不裁切溢出內容", getComputedStyle($(".heatmap-card")).overflow === "visible",
      getComputedStyle($(".heatmap-card")).overflow);

    $(".heatmap-scroll").dispatchEvent(new MouseEvent("mouseleave", { bubbles: true }));
    await settle(80);
    check("移開後提示框消失", $("#heatTooltip").hidden);
  }

  section("   年度沉浸（一整年一天一格，像 GitHub 貢獻圖）");
  {
    const IM = await import("./core/storage/immersionStore.js");
    const { immersionLevelForMinutes: lvlOf } = await import("./core/analytics/analytics.js");
    const { toLocalDateKey } = await import("./core/models.js");
    const now = new Date();
    const Y = now.getFullYear();
    const daysInYear = (y) => Math.round((new Date(y + 1, 0, 1) - new Date(y, 0, 1)) / 86400000);
    const minutesByDate = async (y) => {
      const rows = await IM.getSessionsBetween(new Date(y, 0, 1).toISOString(), new Date(y, 11, 31, 23, 59, 59, 999).toISOString());
      const map = {};
      for (const s of rows) { const k = toLocalDateKey(s.startedAt); map[k] = (map[k] || 0) + (s.watchedSeconds || 0) / 60; }
      return map;
    };
    const cellDate = (y, i) => toLocalDateKey(new Date(y, 0, 1 + i));

    const yc = $("#yearCard");
    check("★ 標題是「年度沉浸」（拿掉了「紀錄」）", !!yc && yc.querySelector(".heatmap-title")?.textContent.trim() === "年度沉浸",
      yc && yc.querySelector(".heatmap-title")?.textContent.trim());
    const blockIds = $$(".home-stack > .home-block").map(b => b.dataset.block).join(",");
    check("預設排在沉浸習慣下面、底部留白上面",
      blockIds === "overview,weekly,habit,year" && yc.closest(".home-block")?.dataset.block === "year" &&
      $(".home-stack").lastElementChild.classList.contains("home-bottom-spacer"), blockIds);
    check("沉浸習慣（5 週）照舊保留", $$(".heatmap-cell").length > 0 && $$(".heatmap-col-label").length === 5);

    const weeks = Number(getComputedStyle($("#yearCard .year-grid")).getPropertyValue("--weeks"));
    const dayCells = $$("#yearCard .year-cell:not(.is-out)");
    check(`★ 今年每一天一格（${daysInYear(Y)} 格）`, dayCells.length === daysInYear(Y), dayCells.length);
    check("53 或 54 直行（一直行 = 一週）", weeks === 53 || weeks === 54, weeks);
    check("7 列，左邊標週一／週三／週五",
      $$("#yearCard .year-dow").map(e => e.textContent).join(",") === "週一,,週三,,週五,,",
      $$("#yearCard .year-dow").map(e => e.textContent).join(","));
    check("上方標 1 月到 12 月",
      $$("#yearCard .year-month").map(e => e.textContent).join(",") === Array.from({ length: 12 }, (_, i) => `${i + 1}月`).join(","));
    const gridKids = [...$("#yearCard .year-grid").children];
    const jan1 = $('#yearCard .year-cell[data-i="0"]');
    const jan1Pos = gridKids.indexOf(jan1);
    check("1 月 1 日在第一直行、正確的星期那一列",
      jan1Pos % (weeks + 1) === 1 && Math.floor(jan1Pos / (weeks + 1)) === (new Date(Y, 0, 1).getDay() + 6) % 7,
      `第 ${Math.floor(jan1Pos / (weeks + 1))} 列、第 ${jan1Pos % (weeks + 1)} 格`);
    const monthLabel = $$("#yearCard .year-month")[now.getMonth()];
    const labelRect = monthLabel.getBoundingClientRect();

  await settle(600);
  $$(".mem-video-card").find(c => c.textContent.includes("影片 B")).click();
  await settle(450);
  check("進度是 1 / 2", ($(".mem-progress-label")?.textContent||"").replace(/\s/g,"") === "1/2",
    $(".mem-progress-label")?.textContent);
  check("沒有混入影片 A 的字", !txt().includes("advantage") && !txt().includes("fluent"));

  section("8. 垃圾桶刪除（存錯的字）");
  {
    const doomed = $(".mem-term").textContent.trim();
    const before = (await V.getAllWords()).length;
    globalThis.confirm = () => true; // 略過確認對話框
    $("#memDelete").click();
    await settle(500);

    const after = await V.getAllWords();
    check("單字真的被刪除", after.length === before - 1, `${before} → ${after.length}`);
    check("被刪的是對的那一個", !after.some(w => w.term === doomed), doomed);
    check("進度更新為 1 / 1", ($(".mem-progress-label")?.textContent||"").replace(/\s/g,"") === "1/1",
      $(".mem-progress-label")?.textContent);

    $('[data-view="home"]').click();
    await settle(600);
    check("★ 刪除後首頁「今日新單字」降為 4",
      $$(".summary-value-num").map(e => e.textContent.trim()).includes("4"),
      $$(".summary-value-num").map(e => e.textContent.trim()).join("/"));
    check("累積收藏也跟著降為 4", txt().includes("累積收藏 4 詞"), txt().match(/累積收藏 \d+ 詞/)?.[0]);
  }

  section("9. 刪光一部影片的字，該影片從清單消失");
  {
    globalThis.confirm = () => true;
    $('[data-view="memory"]').click();
    await settle(600);
    const cardsBefore = $$(".mem-video-card").length;
    $$(".mem-video-card").find(c => c.textContent.includes("影片 B")).click();
    await settle(450);
    $("#memDelete").click();          // 影片 B 只剩最後一個字
    await settle(500);
    check("刪完最後一個字會自動回影片清單", !!$(".mem-video-card") && !$(".mem-term"));
    check("該影片從清單消失", $$(".mem-video-card").length === cardsBefore - 1,
      `${cardsBefore} → ${$$(".mem-video-card").length}`);
  }

  section("10. 設定");
  $('[data-view="settings"]').click();
  await settle(400);
  const slider = $("#goalSlider");
  check("每日沉浸目標滑桿 5–120 / 每 5 分鐘",
    slider && slider.min === "5" && slider.max === "120" && slider.step === "5",
    slider && `${slider.min}-${slider.max} step ${slider.step}`);
  check("讀回已存的 25 分鐘", slider.value === "25", slider.value);
  slider.value = "45"; slider.dispatchEvent(new Event("change", { bubbles: true }));
  await settle(200);
  check("放開後寫入儲存", mem.flowstudySettings?.dailyGoalMinutes === 45);
  check("有淺色/深色切換", $$(".theme-btn").length === 2);
  check("沒有訂閱 / 語言偏好 / 刪除帳戶",
    !txt().includes("訂閱") && !txt().includes("語言偏好") && !txt().includes("刪除帳戶"));

  section("11. 沉浸時數維護已移除，換成資料備份");
  {
    check("★ 沒有「沉浸時數維護」與「從其他工具帶入的時數」",
      !txt().includes("沉浸時數維護") && !txt().includes("帶入的時數") && !$("#legacyH") && !$("#dataMaintenance"));
    const MIG = await import("./core/storage/migrate.js");
    check("★ 不再有自動帶入 zeroStudy 時數的程式", typeof MIG.importLegacyHoursIfNeeded === "undefined");

    check("帳號與雲端同步排在設定頁第一張", $("#settingsView .card")?.id === "accountCard", $("#settingsView .card")?.id);
    check("未登入時顯示「使用 Google 登入」", !!$("#signInBtn") && $("#signInBtn").textContent.includes("使用 Google 登入"));
    check("Google 按鈕是圓角膠囊（有套到樣式）", getComputedStyle($("#signInBtn")).borderRadius === "999px",
      getComputedStyle($("#signInBtn")).borderRadius);

    const tc = $("#translateCard");
    check("有「中英雙字幕」卡片", !!tc && tc.textContent.includes("中英雙字幕"));
    check("金鑰輸入框是密碼欄位（不會明碼顯示在畫面上）", $("#geminiKeyInput")?.type === "password");
    check("還沒設定金鑰時顯示用 Google 翻譯", tc && tc.textContent.includes("Google 翻譯（還沒設定 Gemini 金鑰）"));
    check("還沒設定金鑰時不顯示「移除金鑰」", $("#clearGeminiKey")?.hidden === true);
    check("有申請金鑰的連結", !!tc?.querySelector('a[href="https://aistudio.google.com/apikey"]'));

    const card = $("#backupCard");
    check("設定頁有資料備份卡片", !!card);
    check("有「立即備份」與「從備份檔還原」兩顆按鈕", !!$("#backupNow") && !!$("#restoreBtn"));
    check("還原只收 JSON 檔", ($("#restoreFile")?.accept || "").includes(".json"), $("#restoreFile")?.accept);
    check("還沒備份過時照實顯示", card.textContent.includes("還沒有備份過"), card.textContent.trim().slice(0, 80));
    check("按鈕樣式有套用（不是瀏覽器預設外觀）",
      getComputedStyle($("#backupNow")).borderRadius === "8px", getComputedStyle($("#backupNow")).borderRadius);
  }

  section("12. 深色主題 = GitHub 配色");
  {
    $('[data-theme-value="dark"]').click();
    await settle(200);
    const bg = (sel) => getComputedStyle($(sel)).backgroundColor;
    check("切到深色", document.documentElement.getAttribute("data-theme") === "dark");
    check("★ 內容區是 GitHub 的 #0d1117", bg("body") === "rgb(13, 17, 23)", bg("body"));
    check("★ 側欄是 GitHub 頂欄的 #010409", bg(".sidebar") === "rgb(1, 4, 9)", bg(".sidebar"));
    check("卡片框線是 #3d444d", getComputedStyle($("#backupCard")).borderTopColor === "rgb(61, 68, 77)",
      getComputedStyle($("#backupCard")).borderTopColor);
    check("主要文字是 #f0f6fc", getComputedStyle($(".page-title")).color === "rgb(240, 246, 252)",
      getComputedStyle($(".page-title")).color);
    check("主要按鈕是 GitHub 綠 #238636", bg("#backupNow") === "rgb(35, 134, 54)", bg("#backupNow"));
    $('[data-theme-value="light"]').click();
    await settle(200);
    check("切回淺色後底色還原", bg("body") === "rgb(249, 250, 251)", bg("body"));
  }

  paint();
})().catch(e => { lines.push("\n例外：" + (e && e.stack || e)); fail++; paint(); });
</script>
</body>
</html>
