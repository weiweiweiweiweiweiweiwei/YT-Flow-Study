<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>FlowStudy 學習面板</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="alternate icon" href="icon-32.png" />
  <link rel="stylesheet" href="review.css" />
  <link rel="stylesheet" href="review-pages.css" />
  <script src="theme-init.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <img class="sidebar-logo-mark" src="icon.svg" alt="" />
        FlowStudy
      </div>

      <nav class="sidebar-nav">
        <a class="sidebar-link" data-view="home" href="review.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
            <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          </svg>
          首頁
        </a>

        <!-- 記憶固化（間隔重複複習）目前不放進側邊欄——使用者現階段以大量沉浸為主，
             用不到複習功能。頁面與路由都保留著，需要時把這個連結加回來即可：
             <a class="sidebar-link" data-view="reinforce" href="review.html?view=reinforce">…</a> -->

        <a class="sidebar-link" data-view="memory" href="review.html?view=memory">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          記憶固化
        </a>

        <a class="sidebar-link" data-view="settings" href="review.html?view=settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          設定
        </a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">儀表板</div>
      </header>

      <div class="content">
        <div class="content-inner">
          <div class="page-header">
            <div>
              <h1 class="page-title" id="pageTitle">首頁</h1>
              <p class="page-subtitle" id="pageSubtitle"></p>
            </div>
            <span class="lang-badge" id="langBadge">English</span>
          </div>

          <section id="homeView"></section>
          <section id="memoryView"></section>
          <section id="settingsView"></section>
        </div>
      </div>
    </main>
  </div>

  <!-- type="module" 讓這個頁面可以直接 import core/ 底下的資料層，不需要打包工具 -->
  <script type="module" src="review.js"></script>
</body>
</html>
