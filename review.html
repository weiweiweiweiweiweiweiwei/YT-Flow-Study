<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>FlowStudy 學習面板</title>
  <link rel="stylesheet" href="review.css" />
</head>
<body>
  <div class="bg-decor" aria-hidden="true"></div>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo">FlowStudy</div>
      <nav class="sidebar-nav">
        <a class="sidebar-link" data-view="home" href="review.html">
          <span class="sidebar-link-icon">🏠</span>首頁
        </a>
        <a class="sidebar-link" data-view="words" href="review.html?view=words">
          <span class="sidebar-link-icon">📖</span>收藏單字
        </a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">首頁</h1>
          <p class="topbar-sub">歡迎回來！<span id="todayDateLabel"></span></p>
        </div>
      </header>

      <section id="homeView">
        <div class="cards-row">
          <div class="glass-card goal-card">
            <div class="card-label-row">
              <span class="card-label">今日沉浸分鐘數</span>
              <button class="goal-edit-btn" id="goalEditBtn" title="設定每日目標" aria-label="設定每日目標">✎</button>
            </div>
            <div class="goal-big-value" id="todayMinutesValue">0</div>
            <div class="progress-track">
              <div class="progress-fill" id="goalProgressFill" style="width: 0%"></div>
            </div>
            <div class="goal-meta-row">
              <span id="goalMinutesLabel">0 / 30 mins</span>
              <span id="goalRemainingText"></span>
            </div>
            <div class="goal-edit-row" id="goalEditRow" hidden>
              <input type="number" id="goalEditInput" min="1" step="1" />
              <span>分鐘</span>
              <button class="goal-save-btn" id="goalSaveBtn">儲存</button>
            </div>
          </div>

          <div class="glass-card total-card">
            <div class="card-label">總沉浸時數</div>
            <div class="total-big-value" id="totalTimeValue">0 m</div>
          </div>
        </div>

        <section class="glass-card chart-section">
          <h2>最近 7 天沉浸時數</h2>
          <div class="chart-legend"><span class="legend-dot"></span>沉浸時間</div>
          <div class="bar-chart" id="barChart"></div>
        </section>
      </section>

      <section id="wordsView">
        <div class="word-list" id="wordList"></div>
      </section>
    </main>
  </div>
  <script src="review.js"></script>
</body>
</html>
