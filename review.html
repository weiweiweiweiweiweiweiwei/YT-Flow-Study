<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>FlowStudy 學習面板</title>
  <link rel="stylesheet" href="review.css" />
  <script src="theme-init.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-logo">FlowStudy</div>
      <nav class="sidebar-nav">
        <a class="sidebar-link" data-view="home" href="review.html">
          <span class="sidebar-link-icon">🏠</span>首頁
        </a>
        <a class="sidebar-link" data-view="words" href="review.html?view=words">
          <span class="sidebar-link-icon">📖</span>收藏單字
        </a>
      </nav>
      <div class="sidebar-bottom">
        <a class="sidebar-link" data-view="settings" href="review.html?view=settings">
          <span class="sidebar-link-icon">⚙️</span>設定
        </a>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">首頁</h1>
          <p class="topbar-sub">歡迎回來！<span id="todayDateLabel"></span></p>
        </div>
      </header>

      <section id="homeView">
        <div class="cards-row">
          <div class="card goal-card">
            <div class="card-label">今日沉浸分鐘數</div>
            <div class="goal-big-value" id="todayMinutesValue">0</div>
            <div class="progress-track">
              <div class="progress-fill" id="goalProgressFill" style="width: 0%"></div>
            </div>
            <div class="goal-meta-row">
              <span id="goalMinutesLabel">0 / 30 mins</span>
              <span id="goalRemainingText"></span>
            </div>
          </div>

          <div class="card total-card">
            <div class="card-label">總沉浸時數</div>
            <div class="total-big-value" id="totalTimeValue">0 m</div>
          </div>
        </div>

        <section class="card chart-section">
          <h2>最近 7 天沉浸時數</h2>
          <div class="chart-legend"><span class="legend-dot"></span>沉浸時間</div>
          <div class="bar-chart" id="barChart"></div>
        </section>
      </section>

      <section id="wordsView">
        <div class="word-list" id="wordList"></div>
      </section>

      <section id="settingsView">
        <div class="card settings-card">
          <h2>每日沉浸目標</h2>
          <p class="settings-hint">設定每天想沉浸多久，首頁的進度條會依這個目標計算。</p>
          <div class="goal-slider-row">
            <input type="range" id="goalSlider" min="0" max="4" step="1" list="goalTicks" />
            <datalist id="goalTicks">
              <option value="0"></option>
              <option value="1"></option>
              <option value="2"></option>
              <option value="3"></option>
              <option value="4"></option>
            </datalist>
          </div>
          <div class="goal-slider-labels">
            <span>15 分鐘</span>
            <span>30 分鐘</span>
            <span>1 小時</span>
            <span>2 小時</span>
            <span>3 小時</span>
          </div>
          <div class="goal-slider-current">目前目標：<strong id="goalSliderValue">30 分鐘</strong></div>
        </div>

        <div class="card settings-card">
          <h2>外觀</h2>
          <p class="settings-hint">選擇淺色或深色介面。</p>
          <div class="theme-toggle-row">
            <button class="theme-btn" id="themeLightBtn" data-theme-value="light">☀️ 淺色</button>
            <button class="theme-btn" id="themeDarkBtn" data-theme-value="dark">🌙 深色</button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="review.js"></script>
</body>
</html>
