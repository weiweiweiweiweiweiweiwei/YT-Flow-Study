<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>FlowStudy 播放器介面測試</title>
<link rel="stylesheet" href="content.css" />
<style>
  body { font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; margin: 24px; background: #fff; color: #111; }
  #out { position: fixed; right: 12px; top: 12px; width: 460px; max-height: 92vh; overflow: auto; z-index: 99999;
         background: #0f172a; color: #e2e8f0; font: 12px/1.6 ui-monospace, monospace; padding: 12px 14px;
         border-radius: 10px; white-space: pre-wrap; }
  #movie_player { position: relative; width: 960px; height: 540px; background: #222; overflow: hidden; }
  .ytp-chrome-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; justify-content: flex-end; }
</style>
<script>
  // content.js 從網址的 ?v= 判斷「現在是哪部影片」
  history.replaceState(null, "", location.pathname + "?v=HARNESSVID1");
</script>
</head>
<body>
<p style="max-width:900px;color:#555;font-size:13px">
  把<b>真正的 content.js</b> 放進一個假的 YouTube 播放器裡跑：假的字幕橋接層送出人工字幕，
  假的背景把翻譯請求記下來並回傳假翻譯。<b>需要用本機伺服器開啟</b>。
</p>

<div id="movie_player" class="html5-video-player">
  <video class="html5-main-video"></video>
  <div class="ytp-chrome-bottom"><div class="ytp-right-controls"></div></div>
</div>
<pre id="out">執行中…</pre>

<script>
// ===== 假的影片時間：沒有真的影片檔，currentTime / paused 由測試直接控制 =====
const video = document.querySelector("video");
let fakeTime = 0;
Object.defineProperty(video, "currentTime", { get: () => fakeTime, set: (v) => { fakeTime = v; }, configurable: true });
Object.defineProperty(video, "paused", { get: () => true, configurable: true });
function seek(t) { fakeTime = t; video.dispatchEvent(new Event("timeupdate")); }

// ===== 假的字幕：100 句人工字幕（一個 cue 兩句，沒有字級時間），每句 3 秒 =====
const CUES = [];
for (let k = 0; k < 50; k++) {
  CUES.push({ text: `This is sentence number ${2 * k}. And here comes sentence ${2 * k + 1}.`, start: k * 6, end: k * 6 + 6 });
}

// ===== 假的橋接層（MAIN world 那一層）=====
window.addEventListener("message", (e) => {
  const m = e.data;
  if (!m || m.channel !== "flowstudy-to-page" || m.type !== "request-cues") return;
  window.postMessage({ channel: "flowstudy-to-content", type: "cues-result", requestId: m.requestId,
    videoId: m.videoId, ok: true, cues: CUES,
    track: { languageCode: "en", kind: "", label: "英文", isAutoGenerated: false } }, location.origin);
});

// ===== 假的 chrome 擴充功能 API =====
const local = {}, session = {};
const sent = []; // 所有送到背景的訊息
function area(store) {
  return {
    get(keys, cb) {
      let o = {};
      if (keys == null) o = { ...store };
      else (Array.isArray(keys) ? keys : [keys]).forEach(k => { if (store[k] !== undefined) o[k] = store[k]; });
      setTimeout(() => cb && cb(o), 0);
      return Promise.resolve(o);
    },
    set(o, cb) { Object.assign(store, o); if (cb) setTimeout(cb, 0); return Promise.resolve(); },
    remove(k, cb) { (Array.isArray(k) ? k : [k]).forEach(x => delete store[x]); if (cb) cb(); return Promise.resolve(); },
  };
}
window.chrome = {
  storage: { local: area(local), session: area(session), onChanged: { addListener() {} } },
  runtime: {
    lastError: null,
    sendMessage(msg, cb) {
      sent.push(msg);
      let data = null;
      if (msg.type === "subs:translate") {
        data = { translations: msg.payload.texts.map(t => "中文：" + t), engine: "gemini" };
      } else if (msg.type === "immersion:start") {
        data = { id: "sess-1" };
      }
      setTimeout(() => cb && cb({ ok: true, data }), 30);
    },
  },
};
</script>

<script src="core/normalize.js"></script>
<script src="sentence-timeline.js"></script>
<script src="content.js"></script>

<script>
(async function () {
  const lines = [];
  let pass = 0, fail = 0;
  const check = (n, c, d) => { if (c) { pass++; lines.push("  ✓ " + n); } else { fail++; lines.push("  ✗ " + n + (d !== undefined ? "\n      → " + d : "")); } };
  const section = (t) => lines.push("\n" + t);
  const wait = (ms) => new Promise(r => setTimeout(r, ms));
  const $ = (s) => document.querySelector(s);
  async function until(cond, ms = 4000) { const t0 = Date.now(); while (!cond() && Date.now() - t0 < ms) await wait(50); return cond(); }
  const translateCalls = () => sent.filter(m => m.type === "subs:translate");

  try {
    section("0. 啟動");
    check("齒輪按鈕掛上播放器控制列", await until(() => !!$("#zerostudy-settings-btn")));
    check("人工字幕載入成句子時間軸", await until(() => typeof timelineStatus !== "undefined" && timelineStatus === "ready"),
      typeof timelineStatus !== "undefined" ? timelineStatus : "undefined");
    check("100 句", sentenceTimeline.length === 100, sentenceTimeline.length);

    // ---------- 設定面板 ----------
    section("1. 設定面板：沒有「完成」，點外面就關");
    $("#zerostudy-settings-btn").click();
    await wait(50);
    const panel = () => $("#zerostudy-settings-panel");
    check("點齒輪打開面板", !!panel());
    check("★ 沒有「完成」按鈕", !$("#fsModalDone") && !panel().textContent.includes("完成"));
    const home = $("#fsOpenDashboard");
    check("★ 藍色主按鈕變成「首頁」", home && home.classList.contains("fs-modal-home") && home.textContent.trim() === "首頁",
      home && home.className + " / " + home.textContent.trim());
    check("首頁按鈕是藍底白字", home && getComputedStyle(home).backgroundColor === "rgb(59, 130, 246)" &&
      getComputedStyle(home).color === "rgb(255, 255, 255)", home && getComputedStyle(home).backgroundColor);
    check("首頁按鈕有房子圖示", !!(home && home.querySelector("svg")));
    check("面板裡有「中英雙字幕」開關", !!$("#fsDualSubs") && panel().textContent.includes("中英雙字幕"));
    check("雙字幕預設關閉", $("#fsDualSubs").getAttribute("aria-checked") === "false");

    $(".fs-modal").click(); // 點卡片本身不能關
    await wait(30);
    check("點卡片裡面不會關掉", !!panel());
    panel().dispatchEvent(new MouseEvent("click", { bubbles: true })); // 點遮罩（卡片外面）
    await wait(30);
    check("★ 點卡片外面（遮罩）就關閉", !panel());

    $("#zerostudy-settings-btn").click(); await wait(30);
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
    await wait(30);
    check("按 Esc 也會關閉", !panel());

    $("#zerostudy-settings-btn").click(); await wait(30);
    $("#fsOpenDashboard").click(); await wait(80);
    check("點「首頁」會請背景打開學習面板", sent.some(m => m.type === "open:dashboard"));
    check("點「首頁」之後面板關閉", !panel());

    // ---------- 中英雙字幕 ----------
    section("2. 中英雙字幕");
    $("#zerostudy-immersion-btn").click(); // 沉浸模式是自繪字幕條的總開關
    await wait(100);
    seek(85 * 3 + 0.5); // 第 85 句
    await until(() => $(".flowstudy-caption-text") && $(".flowstudy-caption-text").textContent.includes("85"));
    check("字幕條顯示第 85 句", $(".flowstudy-caption-text").textContent.trim() === "And here comes sentence 85.",
      $(".flowstudy-caption-text") && $(".flowstudy-caption-text").textContent);
    check("還沒開雙字幕時沒有中文", $(".flowstudy-caption-zh").textContent === "");
    check("還沒開雙字幕時不會送出翻譯請求", translateCalls().length === 0, translateCalls().length);

    $("#zerostudy-settings-btn").click(); await wait(30);
    $("#fsDualSubs").click();
    check("開關打開後記住設定", local.flowstudyDualSubs === true);
    check("開關變成開啟狀態", $("#fsDualSubs").getAttribute("aria-checked") === "true");

    await until(() => translateCalls().length >= 3);
    const calls = translateCalls();
    // 佇列是 [80–99, 0–39, 40–79]：目前播到的那一批（只剩 20 句）先送
    check("100 句分成 3 批送出（每批最多 40 句）", calls.length === 3 && calls.map(c => c.payload.texts.length).join(",") === "20,40,40",
      calls.map(c => c.payload.texts.length).join(","));
    check("★ 目前播到的那一批（第 80–99 句）最先送出",
      calls[0].payload.texts[0] === sentenceTimeline[80].text, calls[0].payload.texts[0]);
    check("每一批都附上影片標題當上下文", calls.every(c => typeof c.payload.title === "string"));

    await until(() => $(".flowstudy-caption-zh").textContent !== "");
    check("★ 英文下方出現中文", $(".flowstudy-caption-zh").textContent === "中文：And here comes sentence 85.",
      $(".flowstudy-caption-zh").textContent);
    check("★ 英文那一行沒有混進中文（收藏單字時的例句不會被污染）",
      !$(".flowstudy-caption-text").textContent.includes("中文"), $(".flowstudy-caption-text").textContent);
    check("中文那一行不能點字查詢（不是 .my-word）", !$(".flowstudy-caption-zh .my-word"));
    const zhSize = parseFloat(getComputedStyle($(".flowstudy-caption-zh")).fontSize);
    const enSize = parseFloat(getComputedStyle($(".flowstudy-caption-text")).fontSize);
    check("中文字比英文小一號", zhSize < enSize, `${zhSize} vs ${enSize}`);

    await until(() => $("#fsDualSubsSub").textContent.startsWith("已翻好"));
    check("面板顯示翻譯進度與引擎", $("#fsDualSubsSub").textContent === "已翻好 100 句・Gemini", $("#fsDualSubsSub").textContent);

    seek(12 * 3 + 0.5);
    await wait(50);
    check("換到第 12 句，中文跟著換", $(".flowstudy-caption-zh").textContent === "中文：This is sentence number 12.",
      $(".flowstudy-caption-zh").textContent);

    section("3. 關掉再打開");
    $("#fsDualSubs").click();
    await wait(50);
    check("關掉後中文消失", $(".flowstudy-caption-zh").textContent === "" &&
      getComputedStyle($(".flowstudy-caption-zh")).display === "none");
    check("關掉的設定也記住了", local.flowstudyDualSubs === false);
    const before = translateCalls().length;
    $("#fsDualSubs").click();
    await wait(200);
    check("★ 再打開不會重翻已經翻好的句子", translateCalls().length === before, `${before} → ${translateCalls().length}`);
    check("再打開立刻有中文", $(".flowstudy-caption-zh").textContent === "中文：This is sentence number 12.");

    section("4. 換影片");
    history.replaceState(null, "", location.pathname + "?v=HARNESSVID2");
    onPossibleNavigation();
    check("換片後舊影片的中文清掉", zhByIndex.length === 0);
    await until(() => timelineStatus === "ready" && timelineVideoId === "HARNESSVID2");
    await until(() => translateCalls().length > before);
    check("新影片自動開始翻譯（開關維持開啟）", translateCalls().length > before, `${before} → ${translateCalls().length}`);
  } catch (err) {
    lines.push("\n例外：" + (err && err.stack || err));
    fail++;
  }

  lines.push("\n" + "=".repeat(52));
  lines.push(`通過 ${pass} 項，失敗 ${fail} 項`);
  document.getElementById("out").textContent = lines.join("\n");
  document.title = fail === 0 ? "ALL PASS" : ("FAIL " + fail);
})();
</script>
</body>
</html>
