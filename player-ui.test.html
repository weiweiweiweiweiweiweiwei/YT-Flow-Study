<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>FlowStudy 播放器介面測試</title>
<link rel="stylesheet" href="content.css" />
<style>
  body { font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; margin: 24px; background: #fff; color: #111; }
  #out { position: fixed; right: 12px; top: 12px; width: 460px; max-height: 92vh; overflow: auto; z-index: 99999;
         background: #0f172a; color: #e2e8f0; font: 12px/1.6 ui-monospace, monospace; padding: 12px 14px;
         border-radius: 10px; white-space: pre-wrap; }
  #movie_player { position: relative; width: 960px; height: 540px; background: #222; overflow: hidden; }
  .ytp-chrome-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; justify-content: flex-end; }
</style>
<script>
  // content.js 從網址的 ?v= 判斷「現在是哪部影片」
  history.replaceState(null, "", location.pathname + "?v=HARNESSVID1");
</script>
</head>
<body>
<p style="max-width:900px;color:#555;font-size:13px">
  把<b>真正的 content.js</b> 放進一個假的 YouTube 播放器裡跑：假的字幕橋接層送出人工字幕，
  假的背景把翻譯請求記下來並回傳假翻譯。<b>需要用本機伺服器開啟</b>。
</p>

<div id="movie_player" class="html5-video-player">
  <video class="html5-main-video"></video>
  <div class="ytp-chrome-bottom"><div class="ytp-right-controls"></div></div>
</div>
<pre id="out">執行中…</pre>

<script>
// ===== 假的影片時間：沒有真的影片檔，currentTime / paused 由測試直接控制 =====
const video = document.querySelector("video");
let fakeTime = 0;
Object.defineProperty(video, "currentTime", { get: () => fakeTime, set: (v) => { fakeTime = v; }, configurable: true });
Object.defineProperty(video, "paused", { get: () => true, configurable: true });
function seek(t) { fakeTime = t; video.dispatchEvent(new Event("timeupdate")); }

// ===== 假的字幕：人工字幕（一個 cue 兩句，沒有字級時間），每句約 3 秒 =====
// 句子裡的數字就是它在時間軸上的編號，測試靠它反推「送去翻的是哪幾句」
function makeCues(count) {
  const cues = [];
  for (let k = 0; k < count; k++) {
    cues.push({ text: `This is sentence number ${2 * k}. And here comes sentence ${2 * k + 1}.`, start: k * 6, end: k * 6 + 6 });
  }
  return cues;
}
const CUES = makeCues(50); // 100 句、5 分鐘
const LONG_CUES = makeCues(1200); // 2400 句、2 小時

// ===== 假的橋接層（MAIN world 那一層）=====
window.addEventListener("message", (e) => {
  const m = e.data;
  if (!m || m.channel !== "flowstudy-to-page" || m.type !== "request-cues") return;
  window.postMessage({ channel: "flowstudy-to-content", type: "cues-result", requestId: m.requestId,
    videoId: m.videoId, ok: true, cues: m.videoId === "HARNESSLONG" ? LONG_CUES : CUES,
    track: { languageCode: "en", kind: "", label: "英文", isAutoGenerated: false } }, location.origin);
});

// ===== 假的 chrome 擴充功能 API =====
const local = {}, session = {};
const sent = []; // 所有送到背景的訊息
function area(store) {
  return {
    get(keys, cb) {
      let o = {};
      if (keys == null) o = { ...store };
      else (Array.isArray(keys) ? keys : [keys]).forEach(k => { if (store[k] !== undefined) o[k] = store[k]; });
      setTimeout(() => cb && cb(o), 0);
      return Promise.resolve(o);
    },
    set(o, cb) { Object.assign(store, o); if (cb) setTimeout(cb, 0); return Promise.resolve(); },
    remove(k, cb) { (Array.isArray(k) ? k : [k]).forEach(x => delete store[x]); if (cb) cb(); return Promise.resolve(); },
  };
}
window.chrome = {
  storage: { local: area(local), session: area(session), onChanged: { addListener() {} } },
  runtime: {
    lastError: null,
    sendMessage(msg, cb) {
      sent.push(msg);
      let data = null;
      if (msg.type === "subs:translate" && window.__blockTranslate) {
        // 背景偵測到 Google 暫時擋下這個網路時的回覆
        data = { translations: null, engine: "google", blocked: true, notice: "Google 翻譯暫時限制了這個網路（測試）" };
      } else if (msg.type === "subs:translate") {
        data = { translations: msg.payload.texts.map(t => "中文：" + t), engine: "gemini" };
      } else if (msg.type === "immersion:start") {
        data = { id: "sess-1" };
      }
      setTimeout(() => cb && cb({ ok: true, data }), 30);
    },
  },
};
</script>

<script src="core/normalize.js"></script>
<script src="sentence-timeline.js"></script>
<script src="content.js"></script>

<script>
(async function () {
  const lines = [];
  let pass = 0, fail = 0;
  const check = (n, c, d) => { if (c) { pass++; lines.push("  ✓ " + n); } else { fail++; lines.push("  ✗ " + n + (d !== undefined ? "\n      → " + d : "")); } };
  const section = (t) => lines.push("\n" + t);
  const wait = (ms) => new Promise(r => setTimeout(r, ms));
  const $ = (s) => document.querySelector(s);
  async function until(cond, ms = 4000) { const t0 = Date.now(); while (!cond() && Date.now() - t0 < ms) await wait(50); return cond(); }
  const translateCalls = () => sent.filter(m => m.type === "subs:translate");

  try {
    section("0. 啟動");
    check("齒輪按鈕掛上播放器控制列", await until(() => !!$("#zerostudy-settings-btn")));
    check("人工字幕載入成句子時間軸", await until(() => typeof timelineStatus !== "undefined" && timelineStatus === "ready"),
      typeof timelineStatus !== "undefined" ? timelineStatus : "undefined");
    check("100 句", sentenceTimeline.length === 100, sentenceTimeline.length);

    // ---------- 設定面板 ----------
    section("1. 設定面板：「完成」關視窗，點外面也會關");
    $("#zerostudy-settings-btn").click();
    await wait(50);
    const panel = () => $("#zerostudy-settings-panel");
    check("點齒輪打開面板", !!panel());
    const done = $("#fsModalDone");
    check("★ 最下面的藍色按鈕是「完成」", done && done.classList.contains("fs-modal-done") && done.textContent.trim() === "完成",
      done && done.className + " / " + done.textContent.trim());
    check("完成按鈕是藍底白字", done && getComputedStyle(done).backgroundColor === "rgb(59, 130, 246)" &&
      getComputedStyle(done).color === "rgb(255, 255, 255)", done && getComputedStyle(done).backgroundColor);
    check("★ 設定視窗裡沒有「首頁」按鈕", !$("#fsOpenDashboard") && !panel().textContent.includes("首頁"));
    check("面板裡有「中英雙字幕」開關", !!$("#fsDualSubs") && panel().textContent.includes("中英雙字幕"));
    check("雙字幕預設關閉", $("#fsDualSubs").getAttribute("aria-checked") === "false");

    $(".fs-modal").click(); // 點卡片本身不能關
    await wait(30);
    check("點卡片裡面不會關掉", !!panel());
    panel().dispatchEvent(new MouseEvent("click", { bubbles: true })); // 點遮罩（卡片外面）
    await wait(30);
    check("★ 點卡片外面（遮罩）就關閉", !panel());

    $("#zerostudy-settings-btn").click(); await wait(30);
    document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
    await wait(30);
    check("按 Esc 也會關閉", !panel());

    $("#zerostudy-settings-btn").click(); await wait(30);
    $("#fsModalDone").click(); await wait(80);
    check("★ 點「完成」關閉面板", !panel());
    check("點「完成」不會另外打開學習面板", !sent.some(m => m.type === "open:dashboard"));

    // ---------- 中英雙字幕 ----------
    section("2. 中英雙字幕");
    $("#zerostudy-immersion-btn").click(); // 沉浸模式是自繪字幕條的總開關
    await wait(100);

    // 查字的翻譯小框框層級比設定視窗高，打開設定時要收掉，不然會蓋在設定上面
    seek(10 * 3 + 0.5);
    await until(() => $("#flowstudy-caption-bar .my-word"));
    const word = $("#flowstudy-caption-bar .my-word");
    word.click();
    const box = () => document.getElementById("my-translate-box");
    await until(() => box() && box().style.display === "block");
    check("點字幕上的單字，跳出翻譯小框框", box() && box().style.display === "block");
    $("#zerostudy-settings-btn").click(); await wait(80);
    check("★ 打開設定視窗時，翻譯小框框自動收掉", !!panel() && box().style.display === "none", box().style.display);
    $("#fsModalDone").click(); await wait(30);
    seek(85 * 3 + 0.5); // 第 85 句
    await until(() => $(".flowstudy-caption-text") && $(".flowstudy-caption-text").textContent.includes("85"));
    check("字幕條顯示第 85 句", $(".flowstudy-caption-text").textContent.trim() === "And here comes sentence 85.",
      $(".flowstudy-caption-text") && $(".flowstudy-caption-text").textContent);
    check("還沒開雙字幕時沒有中文", $(".flowstudy-caption-zh").textContent === "");
    check("還沒開雙字幕時不會送出翻譯請求", translateCalls().length === 0, translateCalls().length);

    $("#zerostudy-settings-btn").click(); await wait(30);
    $("#fsDualSubs").click();
    check("開關打開後記住設定", local.flowstudyDualSubs === true);
    check("開關變成開啟狀態", $("#fsDualSubs").getAttribute("aria-checked") === "true");

    await until(() => translateCalls().length >= 1 && !zhProgress.running);
    const calls = translateCalls();
    // 翻的範圍是「往前 30 秒 ～ 往後 10 分鐘」：這部只有 5 分鐘，所以是往前 30 秒那句（第 75 句）到結尾
    check("只送出一批：往前 30 秒到影片結尾（第 75–99 句）", calls.length === 1 && calls[0].payload.texts.length === 25,
      calls.map(c => c.payload.texts.length).join(","));
    check("★ 從目前位置往前 30 秒那一句開始翻（按 a 回上一句也有中文）",
      calls[0].payload.texts[0] === sentenceTimeline[75].text, calls[0].payload.texts[0]);
    check("前面還沒看到的地方不會先翻", !calls[0].payload.texts.includes(sentenceTimeline[10].text));
    check("每一批都附上影片標題當上下文", calls.every(c => typeof c.payload.title === "string"));

    await until(() => $(".flowstudy-caption-zh").textContent !== "");
    check("★ 英文下方出現中文", $(".flowstudy-caption-zh").textContent === "中文：And here comes sentence 85.",
      $(".flowstudy-caption-zh").textContent);
    check("★ 英文那一行沒有混進中文（收藏單字時的例句不會被污染）",
      !$(".flowstudy-caption-text").textContent.includes("中文"), $(".flowstudy-caption-text").textContent);
    check("中文那一行不能點字查詢（不是 .my-word）", !$(".flowstudy-caption-zh .my-word"));
    const zhSize = parseFloat(getComputedStyle($(".flowstudy-caption-zh")).fontSize);
    const enSize = parseFloat(getComputedStyle($(".flowstudy-caption-text")).fontSize);
    check("中文字比英文小一號", zhSize < enSize, `${zhSize} vs ${enSize}`);

    await until(() => $("#fsDualSubsSub").textContent.startsWith("已翻好"));
    check("面板顯示翻到哪裡與引擎", $("#fsDualSubsSub").textContent === "已翻好到影片結尾・Gemini", $("#fsDualSubsSub").textContent);

    const beforeJump = translateCalls().length;
    seek(12 * 3 + 0.5); // 跳回前面還沒翻的地方
    await until(() => $(".flowstudy-caption-zh").textContent !== "");
    check("★ 跳到還沒翻的地方：當下補翻，中文隨後出現", $(".flowstudy-caption-zh").textContent === "中文：This is sentence number 12.",
      $(".flowstudy-caption-zh").textContent);
    await until(() => !zhProgress.running);
    const jumpTexts = translateCalls().slice(beforeJump).flatMap(c => c.payload.texts);
    check("補翻的只有還沒翻過的句子（第 75 句以後不會重送）",
      jumpTexts.length > 0 && !jumpTexts.includes(sentenceTimeline[80].text), jumpTexts.length + " 句");

    section("3. 關掉再打開");
    $("#fsDualSubs").click();
    await wait(50);
    check("關掉後中文消失", $(".flowstudy-caption-zh").textContent === "" &&
      getComputedStyle($(".flowstudy-caption-zh")).display === "none");
    check("關掉的設定也記住了", local.flowstudyDualSubs === false);
    const before = translateCalls().length;
    $("#fsDualSubs").click();
    await wait(200);
    check("★ 再打開不會重翻已經翻好的句子", translateCalls().length === before, `${before} → ${translateCalls().length}`);
    check("再打開立刻有中文", $(".flowstudy-caption-zh").textContent === "中文：This is sentence number 12.");

    section("4. 換影片");
    history.replaceState(null, "", location.pathname + "?v=HARNESSVID2");
    onPossibleNavigation();
    check("換片後舊影片的中文清掉", zhByIndex.length === 0);
    await until(() => timelineStatus === "ready" && timelineVideoId === "HARNESSVID2");
    await until(() => translateCalls().length > before);
    check("新影片自動開始翻譯（開關維持開啟）", translateCalls().length > before, `${before} → ${translateCalls().length}`);

    section("5. Google 暫時擋下網路：停止翻譯、說明原因、不自動重試");
    window.__blockTranslate = true;
    await wait(400); // 讓上一部影片還在跑的批次先結束
    const beforeBlocked = translateCalls().length;
    history.replaceState(null, "", location.pathname + "?v=HARNESSVID3");
    onPossibleNavigation();
    await until(() => timelineStatus === "ready" && timelineVideoId === "HARNESSVID3");
    await until(() => translateCalls().length > beforeBlocked);
    await wait(400);
    const afterBlocked = translateCalls().length;
    check("被擋之後剩下的批次不再送出（只送了第一批）", afterBlocked - beforeBlocked === 1, afterBlocked - beforeBlocked);
    check("面板說明原因", $("#fsDualSubsSub").textContent.includes("Google 翻譯暫時限制"), $("#fsDualSubsSub").textContent);
    check("沒有翻譯就不顯示中文那一行", $(".flowstudy-caption-zh").textContent === "");
    seek(60 + 0.5); seek(90 + 0.5); // 繼續播、跳來跳去
    await wait(300);
    check("★ 被擋的期間播到別句、跳到別處都不會再送（再送只會讓封鎖更久）", translateCalls().length === afterBlocked,
      `${afterBlocked} → ${translateCalls().length}`);
    window.__blockTranslate = false;

    section("6. ★ 長影片（2 小時）：邊看邊翻，一次只翻 10 分鐘");
    const sentenceNo = (text) => Number(text.match(/(\d+)\.$/)[1]); // 句子裡的數字 = 編號 = 開始秒數 / 3
    const requestedSince = (n) => translateCalls().slice(n).flatMap(c => c.payload.texts).map(sentenceNo);
    fakeTime = 0;
    let mark = translateCalls().length;
    history.replaceState(null, "", location.pathname + "?v=HARNESSLONG");
    onPossibleNavigation();
    await until(() => timelineStatus === "ready" && timelineVideoId === "HARNESSLONG");
    check("2 小時的影片，2400 句", sentenceTimeline.length === 2400, sentenceTimeline.length);
    await until(() => translateCalls().length > mark && !zhProgress.running);
    let got = requestedSince(mark);
    check("★ 從頭播放：只翻前 10 分鐘（第 0–199 句），不會整部 2 小時送出去",
      got.length === 200 && Math.min(...got) === 0 && Math.max(...got) === 199, `${got.length} 句，${Math.min(...got)}–${Math.max(...got)}`);
    check("分成 5 批、一批 40 句", translateCalls().length - mark === 5, translateCalls().length - mark);

    mark = translateCalls().length;
    seek(3600 + 0.5); // 跳到 1 小時的地方
    await until(() => translateCalls().length > mark && !zhProgress.running);
    got = requestedSince(mark);
    check("★ 跳到 1:00:00：只翻 0:59:30 ～ 1:10:00（第 1190–1399 句）",
      Math.min(...got) >= 1189 && Math.max(...got) <= 1400 && got.length >= 205, `${got.length} 句，${Math.min(...got)}–${Math.max(...got)}`);
    check("中間跳過的 0:10 ～ 0:59 完全沒翻", zhByIndex.slice(200, 1185).every(v => v === undefined));
    check("跳過去之後有中文", await until(() => $(".flowstudy-caption-zh").textContent !== ""), $(".flowstudy-caption-zh").textContent);

    mark = translateCalls().length;
    seek(3600 + 300 + 0.5); // 繼續看了 5 分鐘：離還沒翻的地方（1:10:00）還有 5 分鐘
    await wait(300);
    check("播到 1:05:00：還沒翻的地方在 5 分鐘後，先不送", translateCalls().length === mark, translateCalls().length - mark);
    check("面板顯示翻到哪裡", /^已翻好到 1:10:0\d（邊看邊翻）/.test($("#fsDualSubsSub").textContent), $("#fsDualSubsSub").textContent);

    seek(3600 + 450 + 0.5); // 播到 1:07:30：還沒翻的地方剩 2.5 分鐘
    await until(() => translateCalls().length > mark && !zhProgress.running);
    got = requestedSince(mark);
    check("★ 播到 1:07:30（剩不到 3 分鐘）→ 往後再翻 10 分鐘，到 1:17:30",
      Math.min(...got) === 1401 && Math.max(...got) <= 1550 && Math.max(...got) >= 1545, `${got.length} 句，${Math.min(...got)}–${Math.max(...got)}`);
    const total = zhByIndex.filter(v => v !== undefined).length;
    check("★ 看了 3 段，總共只翻了約 28 分鐘的字幕（2 小時的 1/4 不到）", total < 600, `${total} / 2400 句`);

    section("7. ★ 懸停自動暫停：只認滑鼠真的有移動");
    // 換成會真的播放／暫停的假影片（前面幾節的影片永遠是暫停狀態）
    let playing = true;
    Object.defineProperty(video, "paused", { get: () => !playing, configurable: true });
    video.play = () => { if (!playing) { playing = true; video.dispatchEvent(new Event("play")); } return Promise.resolve(); };
    video.pause = () => { if (playing) { playing = false; video.dispatchEvent(new Event("pause")); } };
    actionPaused = false; wasPlayingBeforeHover = false; hoverPauseEnabled = true;
    const bar = $("#flowstudy-caption-bar");
    const w1 = () => bar.querySelector(".my-word");
    const outside = $("#movie_player");
    const move = (el) => el.dispatchEvent(new MouseEvent("mousemove", { bubbles: true }));
    const boundary = (type, el, related) => el.dispatchEvent(new MouseEvent(type, { bubbles: true, relatedTarget: related }));
    move(outside);

    // Chrome 在「字幕框變寬、蓋到停著不動的游標」時只送 mouseover，不送 mousemove
    boundary("mouseover", w1(), outside);
    check("★ 滑鼠沒動、字幕框變大蓋到游標（只有 mouseover）→ 不會暫停", playing);
    boundary("mouseout", w1(), outside);
    check("字幕框縮小離開游標（只有 mouseout）→ 也不會動到播放", playing);

    move(w1());
    check("滑鼠真的移到字幕上 → 暫停", !playing);
    move(bar.querySelectorAll(".my-word")[1] || w1());
    check("在字幕的單字之間移動 → 維持暫停", !playing);
    move(outside);
    check("滑鼠移開字幕 → 自動續播", playing);

    move(w1());
    check("再移進字幕 → 暫停", !playing);
    boundary("mouseout", w1(), null);
    check("從字幕直接移出瀏覽器視窗（mouseout 沒有去處）→ 自動續播", playing);

    move(w1());
    document.dispatchEvent(new KeyboardEvent("keydown", { key: " ", code: "Space", bubbles: true }));
    check("★ 懸停暫停中按空白鍵 → 播放", playing);
    boundary("mouseover", w1(), outside); // 換句時字幕框在游標底下變形
    await wait(300);
    check("★ 播放後字幕框在游標底下變形，不會又被自動暫停", playing);
    await wait(300); // 空白鍵有 250ms 防連按
    document.dispatchEvent(new KeyboardEvent("keydown", { key: " ", code: "Space", bubbles: true }));
    check("再按空白鍵 → 暫停", !playing);
    boundary("mouseout", w1(), outside); // 字幕框縮小離開游標
    move(outside);
    check("★ 空白鍵暫停後，滑鼠移開字幕也不會自己開始播", !playing);

    video.play(); move(outside);
    hoverPauseEnabled = false;
    move(w1());
    check("關掉「懸停自動暫停」後，移到字幕上不會暫停", playing);
    hoverPauseEnabled = true;
    move(outside);
  } catch (err) {
    lines.push("\n例外：" + (err && err.stack || err));
    fail++;
  }

  lines.push("\n" + "=".repeat(52));
  lines.push(`通過 ${pass} 項，失敗 ${fail} 項`);
  document.getElementById("out").textContent = lines.join("\n");
  document.title = fail === 0 ? "ALL PASS" : ("FAIL " + fail);
})();
</script>
</body>
