<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>FlowStudy 雲端硬碟同步測試</title>
<style>
 body{font-family:"Segoe UI","Microsoft JhengHei",sans-serif;margin:24px;background:#fff;color:#111}
 pre{background:#f6f7f9;padding:16px;border-radius:8px;white-space:pre-wrap;line-height:1.55;font-size:13px}
 .hint{color:#666;font-size:13px}
</style>
</head>
<body>
<h1>FlowStudy 雲端硬碟同步測試</h1>
<p class="hint">
  真實的 IndexedDB + 真實的同步引擎（core/cloud/sync.js）+ core/cloud/drive.js，
  Google 雲端硬碟換成記憶體裡的假伺服器（行為比照 Drive API v3：appDataFolder、版本號、multipart 上傳）。
  <b>需要用本機伺服器開啟</b>。
</p>
<pre id="out">執行中…</pre>

<script type="module">
// 這個測試會刪掉整個 flowstudy 資料庫，不能在擴充功能自己的網址下執行（會清掉真實資料）
if (location.protocol === "chrome-extension:") {
  document.body.innerHTML =
    '<h1 style="font:600 20px sans-serif;color:#b91c1c">已停止：這個測試會清空學習資料庫</h1>' +
    '<p style="font:14px sans-serif">請用本機伺服器開啟測試頁，不要在擴充功能的網址下執行。</p>';
  throw new Error("拒絕在擴充功能的 origin 執行會清空資料庫的測試");
}

const lines = [];
let pass = 0, fail = 0;
const check = (n, c, d) => {
  if (c) { pass++; lines.push("  ✓ " + n); }
  else { fail++; lines.push("  ✗ " + n + (d !== undefined ? "\n      → " + d : "")); }
};
const section = (t) => lines.push("\n" + t);
const render = () => {
  lines.push("\n" + "=".repeat(52));
  lines.push(`通過 ${pass} 項，失敗 ${fail} 項`);
  lines.push("=".repeat(52));
  document.getElementById("out").textContent = lines.join("\n");
  document.title = fail === 0 ? "ALL PASS" : ("FAIL " + fail);
};

const memStore = {};
globalThis.chrome = {
  storage: {
    local: {
      get(keys, cb) {
        let o = {};
        if (keys == null) o = { ...memStore };
        else if (typeof keys === "string") { if (memStore[keys] !== undefined) o[keys] = memStore[keys]; }
        else if (Array.isArray(keys)) keys.forEach(k => { if (memStore[k] !== undefined) o[k] = memStore[k]; });
        if (cb) cb(o); return Promise.resolve(o);
      },
      set(o, cb) { Object.assign(memStore, o); if (cb) cb(); return Promise.resolve(); },
      remove(k, cb) { (Array.isArray(k) ? k : [k]).forEach(x => delete memStore[x]); if (cb) cb(); return Promise.resolve(); },
    },
    onChanged: { addListener() {}, removeListener() {} },
  },
  runtime: { lastError: null },
};

// ---------- 假的 Google 雲端硬碟（Drive API v3 的子集）----------
function createFakeDrive() {
  const files = new Map(); // id → { name, parents, content, version }
  let nextId = 1;
  const log = [];
  let validToken = "token-1";
  let apiDisabled = false;
  const json = (status, body) => new Response(JSON.stringify(body), { status, headers: { "Content-Type": "application/json" } });

  async function fetchImpl(url, init = {}) {
    const u = new URL(url);
    const method = (init.method || "GET").toUpperCase();
    log.push(`${method} ${u.pathname}${u.search}`);
    if ((init.headers || {}).Authorization !== `Bearer ${validToken}`) return json(401, { error: { message: "Invalid Credentials" } });
    if (apiDisabled) return json(403, { error: { message: "Google Drive API has not been used in project 123 before or it is disabled." } });

    const m = u.pathname.match(/^\/(upload\/)?drive\/v3\/files(?:\/([^/]+))?$/);
    if (!m) return json(404, { error: { message: "not found" } });
    const [, upload, id] = m;

    if (!upload && !id && method === "GET") {
      if (u.searchParams.get("spaces") !== "appDataFolder") return json(400, { error: { message: "只測 appDataFolder" } });
      const name = (u.searchParams.get("q").match(/name = '([^']+)'/) || [])[1];
      const list = [...files.entries()].filter(([, f]) => f.name === name && f.parents.includes("appDataFolder"))
        .map(([fid, f]) => ({ id: fid, version: String(f.version) }));
      return json(200, { files: list });
    }
    if (!upload && id && method === "GET") {
      const f = files.get(id);
      if (!f) return json(404, { error: { message: "File not found" } });
      if (u.searchParams.get("alt") === "media") return new Response(f.content, { status: 200 });
      return json(200, { version: String(f.version) });
    }
    if (upload && !id && method === "POST") {
      // multipart：第一段是檔案資訊，第二段是內容
      const boundary = (init.headers["Content-Type"].match(/boundary=(.+)$/) || [])[1];
      const parts = init.body.split(`--${boundary}`).slice(1, -1)
        .map(p => p.slice(p.indexOf("\r\n\r\n") + 4).replace(/\r\n$/, ""));
      const meta = JSON.parse(parts[0]);
      const fid = "file" + nextId++;
      files.set(fid, { name: meta.name, parents: meta.parents || [], content: parts[1], version: 1 });
      return json(200, { id: fid, version: "1" });
    }
    if (upload && id && method === "PATCH") {
      const f = files.get(id);
      if (!f) return json(404, { error: { message: "File not found" } });
      f.content = init.body;
      f.version++;
      return json(200, { version: String(f.version) });
    }
    return json(400, { error: { message: "unsupported " + method } });
  }

  return {
    fetchImpl, files, log,
    doc: () => { const f = [...files.values()][0]; return f ? JSON.parse(f.content) : null; },
    live: (store) => { const d = [...files.values()][0]; return d ? Object.values(JSON.parse(d.content).rows).filter(r => r.store === store && !r.deleted) : []; },
    expireToken() { validToken = "token-" + (Number(validToken.split("-")[1]) + 1); return validToken; },
    get token() { return validToken; },
    disableApi(v) { apiDisabled = v; },
  };
}

async function wipeDatabase() {
  await new Promise((resolve) => {
    const req = indexedDB.deleteDatabase("flowstudy");
    req.onsuccess = req.onerror = req.onblocked = () => resolve();
  });
}

async function run() {
  await wipeDatabase();
  const { createDriveApi, DRIVE_FILE_NAME } = await import("./core/cloud/drive.js");
  const S = await import("./core/cloud/sync.js");
  const D = await import("./core/storage/db.js");
  const V = await import("./core/storage/vocabularyStore.js");
  const I = await import("./core/storage/immersionStore.js");
  const O = await import("./core/storage/occurrenceStore.js");
  const { STORES } = D;
  const USER = "google:1234567890";

  const drive = createFakeDrive();
  let token = drive.token;
  let renewCalls = 0;
  const makeApi = (fake = drive) => createDriveApi({
    getToken: async () => token,
    renewToken: async () => { renewCalls++; token = fake.token; return token; },
    fetchImpl: fake.fetchImpl,
  });
  const sync = (api = makeApi()) => S.syncWithCloud({ userId: USER, api });

  // ---------- 1. 第一次登入 ----------
  section("1. 第一次登入：本機資料全部推到雲端硬碟");
  await V.saveWordFromSubtitle({ term: "resilient", translation: "有韌性的", videoId: "VID1",
    videoTitle: "影片一", sentence: "Kids are resilient.", startTime: 10, endTime: 12 });
  await V.saveWordFromSubtitle({ term: "cadence", translation: "節奏", videoId: "VID1",
    videoTitle: "影片一", sentence: "Keep a steady cadence.", startTime: 30, endTime: 33 });
  const sess = await I.startSession({ videoId: "VID1", videoTitle: "影片一" });
  await I.addWatchedSeconds(sess.id, 1200);

  const r1 = await sync();
  check("雲端硬碟上建立了一個同步檔", drive.files.size === 1);
  const f = [...drive.files.values()][0];
  check(`★ 檔案放在應用程式專用的隱藏資料夾（appDataFolder），檔名 ${DRIVE_FILE_NAME}`,
    f.parents.includes("appDataFolder") && f.name === DRIVE_FILE_NAME, JSON.stringify(f.parents));
  check("2 個單字、2 則例句、1 段沉浸都在檔案裡",
    drive.live(STORES.VOCABULARY).length === 2 && drive.live(STORES.OCCURRENCES).length === 2 && drive.live(STORES.IMMERSION_SESSIONS).length === 1,
    `${drive.live(STORES.VOCABULARY).length}/${drive.live(STORES.OCCURRENCES).length}/${drive.live(STORES.IMMERSION_SESSIONS).length}`);
  check("推送筆數 > 0", r1.pushed > 0, JSON.stringify(r1));
  const stamps = Object.values(drive.doc().rows).map(r => r.updated_at);
  check("每一列的時間都不一樣（同一批推上去也不會擠在同一個時間點）", new Set(stamps).size === stamps.length);

  const uploadsBefore = drive.log.filter(l => l.startsWith("PATCH") || l.startsWith("POST")).length;
  const r2 = await sync();
  const uploadsAfter = drive.log.filter(l => l.startsWith("PATCH") || l.startsWith("POST")).length;
  check("★ 沒有變動時再同步一次：一筆都不推、也不重新上傳檔案", r2.pushed === 0 && uploadsAfter === uploadsBefore, JSON.stringify(r2));

  section("2. 本機繼續看影片 → 只推有變的那一筆");
  await I.addWatchedSeconds(sess.id, 300);
  const r3 = await sync();
  check("只推 1 筆", r3.pushed === 1, JSON.stringify(r3));
  check("雲端硬碟上秒數更新為 1500", drive.live(STORES.IMMERSION_SESSIONS)[0].data.watchedSeconds === 1500);

  section("3. ★ 換電腦／擴充功能重裝：登入就全部拿回來");
  await wipeDatabase();
  check("（前提）本機確實是空的", (await V.getAllWords()).length === 0);
  const r4 = await S.syncWithCloud({ userId: USER, api: makeApi() });
  check("★ 2 個單字回來了", (await V.getAllWords()).length === 2);
  check("★ 沉浸時數回來了（1500 秒）", (await I.getTotalSeconds()) === 1500, await I.getTotalSeconds());
  const back = await V.findWordByTerm("resilient");
  check("例句掛在正確的單字底下", back && (await O.getOccurrencesForWord(back.id)).length === 1);
  check("拉回之後不需要再推任何東西", r4.pushed === 0, JSON.stringify(r4));

  section("4. 刪掉單字 → 雲端硬碟也刪");
  const cad = await V.findWordByTerm("cadence");
  await V.deleteWord(cad.id);
  await sync();
  check("雲端硬碟上 cadence 變成已刪除", drive.live(STORES.VOCABULARY).length === 1 &&
    Object.values(drive.doc().rows).some(r => r.store === STORES.VOCABULARY && r.record_id === cad.id && r.deleted));

  section("5. ★ 兩台電腦幾乎同時同步：不會互相覆蓋");
  // 電腦 A 先讀了檔案…
  const apiA = makeApi();
  await apiA.pull(null);
  // …這時電腦 B 推了一個新字上去
  const apiB = makeApi();
  await apiB.pull(null);
  await apiB.push([{ store: STORES.VOCABULARY, record_id: "from-B", data: { id: "from-B", term: "brisk" }, deleted: false }]);
  // A 接著推自己的字
  await apiA.push([{ store: STORES.VOCABULARY, record_id: "from-A", data: { id: "from-A", term: "amble" }, deleted: false }]);
  const ids = Object.values(drive.doc().rows).map(r => r.record_id);
  check("★ A 寫入時發現 B 剛寫過，先合併再上傳：兩台推的字都在", ids.includes("from-A") && ids.includes("from-B"), ids.join(","));

  section("6. Google 的 token 過期（一小時）");
  drive.expireToken();
  renewCalls = 0;
  await I.addWatchedSeconds(sess.id, 60);
  const r6 = await sync();
  check("★ 被拒絕（401）時自動換新 token 再試，同步照樣成功", renewCalls >= 1 && r6.pushed >= 1, `renew ${renewCalls}, ${JSON.stringify(r6)}`);

  section("7. 出錯時絕不覆蓋雲端的資料");
  const good = [...drive.files.values()][0].content;
  [...drive.files.values()][0].content = "{這不是 JSON";
  let err7 = null;
  try { await sync(); } catch (e) { err7 = e; }
  check("★ 雲端檔案讀不懂：這次同步失敗，而不是當成「雲端是空的」整個覆蓋掉", !!err7 && [...drive.files.values()][0].content === "{這不是 JSON",
    err7 && err7.message);
  [...drive.files.values()][0].content = good;

  drive.disableApi(true);
  let err8 = null;
  try { await sync(); } catch (e) { err8 = e; }
  check("Google Cloud 專案還沒啟用 Drive API：錯誤訊息直接說要去哪裡啟用", !!err8 && err8.message.includes("Google Drive API"), err8 && err8.message);
  drive.disableApi(false);

  section("8. ★ 從 Supabase 換過來：新帳號 id 的第一次同步會把本機全部推上去");
  const local = (await V.getAllWords()).length;
  const fresh = createFakeDrive();
  token = fresh.token;
  const r8 = await S.syncWithCloud({ userId: "google:another", api: makeApi(fresh) });
  check("全新的雲端硬碟拿到本機所有單字", fresh.live(STORES.VOCABULARY).length === local, `${fresh.live(STORES.VOCABULARY).length} / ${local}`);
  check("本機資料一筆都沒少", (await V.getAllWords()).length === local);

  await wipeDatabase();
}

run().catch((err) => { lines.push("\n例外：" + (err && err.stack || err)); fail++; }).finally(render);
</script>
</body>
</html>
