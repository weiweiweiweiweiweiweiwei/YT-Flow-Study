<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <style>
    /* 工具列小面板。
       只做兩件事：讓使用者一眼看到今天沉浸了多久，以及一鍵進首頁。

       翻譯框大小的設定已經從這裡拿掉了——它現在跟字幕大小綁在一起，
       統一在播放器控制列的齒輪裡調整。同一個比例分散在兩個地方調，
       只會調出比例對不起來的結果。 */
    :root {
      --fs-ink: #020617;
      --fs-sub: #64748b;
      --fs-line: #e2e8f0;
      --fs-accent: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      width: 248px;
      margin: 0;
      padding: 18px 16px 16px;
      font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--fs-ink);
      background: #fff;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .brand img {
      width: 24px;
      height: 24px;
      padding: 4px;
      border-radius: 7px;
      background: #111827;
    }

    /* 今日沉浸：數字是主角，單位與說明退到旁邊 */
    .today {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .today-num {
      font-size: 44px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }
    .today-unit {
      font-size: 14px;
      color: var(--fs-sub);
    }
    .today-label {
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--fs-sub);
    }
    .today.is-loading .today-num { color: var(--fs-line); }

    hr {
      border: none;
      border-top: 1px solid var(--fs-line);
      margin: 16px 0 14px;
    }

    .home-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px 0;
      border: none;
      border-radius: 9px;
      background: var(--fs-accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .home-btn:hover { background: #1d4ed8; }
    .home-btn svg { width: 17px; height: 17px; }

    .hint {
      margin: 12px 0 0;
      font-size: 11.5px;
      line-height: 1.6;
      color: var(--fs-sub);
    }
  </style>
</head>
<body>
  <div class="brand">
    <img src="icon.svg" alt="" />
    FlowStudy
  </div>

  <div class="today is-loading" id="today">
    <span class="today-num" id="todayNum">—</span>
    <span class="today-unit">分鐘</span>
  </div>
  <p class="today-label">今日沉浸分鐘數</p>

  <hr />

  <button class="home-btn" id="openHomeBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
      <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    </svg>
    首頁
  </button>

  <p class="hint">字幕與翻譯框大小，請在播放器控制列的齒輪裡調整。</p>

  <script src="popup.js"></script>
</body>
</html>
