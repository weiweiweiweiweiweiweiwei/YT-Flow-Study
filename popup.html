<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 220px;
      font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      padding: 14px;
    }
    h3 {
      margin: 0 0 10px;
      font-size: 14px;
    }
    .size-row {
      display: flex;
      gap: 6px;
    }
    .size-btn {
      flex: 1;
      padding: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
      cursor: pointer;
      font-size: 13px;
    }
    .size-btn:hover {
      background: #f0f0f0;
    }
    .size-btn.active {
      background: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }
    p {
      color: #888;
      font-size: 12px;
      margin-top: 10px;
      line-height: 1.5;
    }
    hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 16px 0;
    }
    .review-link-btn {
      display: block;
      width: 100%;
      padding: 10px 0;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 4px;
    }
    .review-link-btn:hover {
      background: #2f6fe0;
    }
  </style>
</head>
<body>
  <button class="review-link-btn" id="openReviewBtn">📖 我的學習中心</button>

  <hr />

  <h3>翻譯框框大小</h3>
  <div class="size-row" id="sizeRow">
    <button class="size-btn" data-size="75">75%</button>
    <button class="size-btn" data-size="100">100%</button>
    <button class="size-btn" data-size="150">150%</button>
    <button class="size-btn" data-size="200">200%</button>
  </div>
  <p>點字幕單字或選取片語時跳出的翻譯小框框，會套用這個大小（立即生效，不用重新整理）。</p>

  <p style="margin-top: 16px;">每日沉浸目標、深淺色模式等設定，請到「我的學習中心」裡的「設定」頁面調整。</p>
  <script src="popup.js"></script>
</body>
</html>
