<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FlowStudy">
  <title>FlowStudy</title>

  <!-- 粗體圓潤的「C」：外弧 r=42、內弧 r=16，缺口開在右側 ±54.4°。
       一條封閉路徑 + 描邊（而不是兩層圖形疊起來），黑框與黃色填滿永遠對齊，
       縮到 16px 當圖示時也不會出現接縫。

       兩端的收尾是「半圓」而不是徑向切一刀：
       收尾圓心放在環帶正中央（r=29），半徑 13 =（42-16)/2，
       所以它同時內切外弧、外切內弧，接點是相切的，描邊會順順地繞過去，
       不會有轉角。

       缺口角度看起來比數字大得多——半圓收尾會往缺口裡凸出約 13，
       兩個尖端實際只距離 32（扣掉描邊後可見開口約 24）。
       想再開大一點就把 ±54.4° 往上加，記得四個端點座標要一起重算。 -->
  <path d="M 74.45 15.85
           A 42 42 0 1 0 74.45 84.15
           A 13 13 0 0 0 59.31 63.01
           A 16 16 0 1 1 59.31 36.99
           A 13 13 0 0 0 74.45 15.85
           Z"
        fill="#F5BE18"
        stroke="#141414"
        stroke-width="8"
        stroke-linejoin="round"
        stroke-linecap="round"/>
</svg>
